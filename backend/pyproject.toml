[project]
name = "print-assist"
version = "0.1.0"
description = "3D Print Assist backend: parametric model, geometry and API"
authors = [
    { name = "Ryan Smith", email = "ryanasmith@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "build123d>=0.13.0",
    "fastapi>=0.142.2",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pillow-heif>=1.8.1",
    "print-assist-mcp",
    "python-multipart>=0.0.32",
    "resvg-py>=0.5.0",
    "scipy>=1.13",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
print-assist-mcp = { path = "../mcp", editable = true }
