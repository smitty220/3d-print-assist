<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#17253B"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- App squircle -->
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#bg)"/>
  <rect x="52" y="52" width="920" height="920" rx="208" fill="none" stroke="#1E293B" stroke-width="5"/>

  <!-- Isometric 3D Cube (centered, bold, cohesive) -->
  <!-- Top face -->
  <polygon points="512,216 768,364 512,512 256,364" fill="url(#topFace)"/>
  <!-- Left face -->
  <polygon points="256,364 512,512 512,808 256,660" fill="url(#leftFace)"/>
  <!-- Right face -->
  <polygon points="768,364 512,512 512,808 768,660" fill="url(#rightFace)"/>

  <!-- Clean CAD wireframe edges -->
  <polygon points="512,216 768,364 768,660 512,808 256,660 256,364" fill="none" stroke="#E0F2FE" stroke-width="10" stroke-linejoin="round"/>
  <polyline points="256,364 512,512 768,364" fill="none" stroke="#E0F2FE" stroke-width="10" stroke-linejoin="round"/>
  <line x1="512" y1="512" x2="512" y2="808" stroke="#E0F2FE" stroke-width="10" stroke-linecap="round"/>

  <!-- Subtle internal CAD axes (hidden back edges) -->
  <line x1="512" y1="216" x2="512" y2="512" stroke="#0F172A" stroke-opacity="0.18" stroke-width="6" stroke-dasharray="14 14"/>

  <!-- CAD Vertex Anchor Points (crisp white-ringed nodes at all 7 visible vertices) -->
  <!-- Outer 6 vertices -->
  <g fill="#0B1120" stroke="#F8FAFC" stroke-width="10">
    <circle cx="512" cy="216" r="22"/>
    <circle cx="768" cy="364" r="22"/>
    <circle cx="768" cy="660" r="22"/>
    <circle cx="512" cy="808" r="22"/>
    <circle cx="256" cy="660" r="22"/>
    <circle cx="256" cy="364" r="22"/>
  </g>
  <!-- Active center-front CAD anchor point (highlighted in amber) -->
  <circle cx="512" cy="512" r="28" fill="#0B1120" stroke="#F59E0B" stroke-width="12"/>
  <circle cx="512" cy="512" r="10" fill="#FDE68A"/>
</svg>
