<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- App squircle -->
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#bg)"/>
  <rect x="52" y="52" width="920" height="920" rx="208" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Subtle radial aura behind cube -->
  <circle cx="512" cy="560" r="310" fill="url(#glow)"/>

  <!-- Build plate base line -->
  <path d="M236 742 L512 856 L788 742" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Isometric 3D Cube (printed part) -->
  <!-- Top face -->
  <polygon points="512,350 742,468 512,586 282,468" fill="url(#topFace)"/>
  <!-- Left face -->
  <polygon points="282,468 512,586 512,818 282,700" fill="url(#leftFace)"/>
  <!-- Right face -->
  <polygon points="742,468 512,586 512,818 742,700" fill="url(#rightFace)"/>

  <!-- Subtle 3D print layer lines on side faces -->
  <path d="M282,545 L512,663 L742,545" fill="none" stroke="#BAE6FD" stroke-opacity="0.35" stroke-width="8" stroke-linejoin="round"/>
  <path d="M282,622 L512,740 L742,622" fill="none" stroke="#BAE6FD" stroke-opacity="0.28" stroke-width="8" stroke-linejoin="round"/>

  <!-- Crisp edge highlight -->
  <polyline points="282,468 512,586 742,468" fill="none" stroke="#E0F2FE" stroke-opacity="0.65" stroke-width="7" stroke-linejoin="round"/>
  <line x1="512" y1="586" x2="512" y2="818" stroke="#E0F2FE" stroke-opacity="0.55" stroke-width="7"/>

  <!-- Minimalist print nozzle hovering above top vertex -->
  <rect x="466" y="146" width="92" height="58" rx="14" fill="url(#nozzle)"/>
  <polygon points="466,204 558,204 526,274 498,274" fill="url(#nozzle)"/>
  <!-- Warm filament bead / laser focus -->
  <circle cx="512" cy="306" r="16" fill="#F59E0B"/>
  <circle cx="512" cy="306" r="7" fill="#FEF3C7"/>
</svg>
